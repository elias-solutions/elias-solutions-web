<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Elias Solutions GmbH — Software & KI · Schweiz</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Elias Solutions GmbH — Schweizer Software-Entwicklung für eGovernment, Versicherungen und Banken, und KI-Befähigung für KMU. Swiss Made, Hägendorf.">
  <meta name="theme-color" content="#E30613">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <script>
    // Apply the theme before first paint to avoid a flash. Use the saved
    // choice if present, otherwise follow the OS preference on first visit.
    (function () {
      try {
        var t = localStorage.getItem('es-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
