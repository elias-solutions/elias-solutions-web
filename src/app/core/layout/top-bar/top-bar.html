<div class="topbar">
  <div class="wrap inner">
    <div class="lang" role="group" aria-label="Sprache / Language">
      @for (lang of i18n.languages; track lang) {
        <button
          type="button"
          (click)="select(lang)"
          [attr.aria-pressed]="i18n.active() === lang"
        >
          {{ lang | uppercase }}
        </button>
      }
    </div>
  </div>
</div>
